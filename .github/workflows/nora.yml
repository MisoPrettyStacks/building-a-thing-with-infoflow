name: nora-supervisor

# Nora's supervisor cycle: every Wednesday she scans the literature,
# updates her hypothesis ledger, re-examines the crowd-activity evidence,
# and issues her standing scientific verdict (HOLD / APPLY_CANDIDATE /
# WITHDRAW) per NORA_CHARTER.md. The verdict is published to the data
# branch, where the runner reads it every cycle to gate the network weight.
# Read-only with respect to the model: this job never changes parameters.
on:
  schedule:
    - cron: "23 18 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nora-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare data-branch worktree
        run: |
          git fetch -q origin data
          git branch -f data-tmp origin/data
          git worktree add ./data-branch data-tmp
      - name: Run Nora's supervisor cycle
        run: |
          node scripts/nora-supervisor.js --data ./data-branch
      - name: Publish verdict to data branch
        run: |
          cd ./data-branch
          git config user.name "nora-supervisor"
          git config user.email "noreply@github.com"
          git add nora_supervisor.json
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -q -m "nora: supervisor cycle $(date -u +%F)"
            git fetch -q origin data
            git rebase -q origin/data || git rebase --abort || true
            git push -q origin HEAD:data
          fi
      - name: Clean up worktree
        if: always()
        run: git worktree remove --force ./data-branch || true
