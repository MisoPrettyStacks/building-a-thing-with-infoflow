name: cora-supervisor

# Cora's supervisor cycle: every Friday she scans the literature,
# updates her hypothesis ledger, re-examines the cross-asset momentum
# evidence, and issues her standing scientific verdict (HOLD /
# APPLY_CANDIDATE / WITHDRAW) per CORA_CHARTER.md. The verdict is
# published to the data branch, where the runner reads it every cycle
# to gate the xasset weight. Read-only with respect to the model:
# this job never changes parameters.
on:
  schedule:
    - cron: "23 16 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cora-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Prepare data-branch worktree
        run: |
          git fetch -q origin data
          git branch -f data-tmp origin/data
          git worktree add ./data-branch data-tmp
      - name: Run Cora's supervisor cycle
        run: |
          node scripts/cora-supervisor.js --data ./data-branch
      - name: Publish verdict to data branch
        run: |
          cd ./data-branch
          git config user.name "cora-supervisor"
          git config user.email "noreply@github.com"
          git add cora_supervisor.json
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -q -m "cora: supervisor cycle $(date -u +%F)"
            for attempt in 1 2 3 4 5; do
              git fetch -q origin data
              if git rebase -q origin/data && git push -q origin HEAD:data; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
          fi
      - name: Clean up worktree
        if: always()
        run: git worktree remove --force ./data-branch || true
