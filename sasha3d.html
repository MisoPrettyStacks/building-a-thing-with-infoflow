<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentiment — live 3D (noisy experimental)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0812; }
  #scene { position: fixed; inset: 0; }
  .hud {
    position: fixed; z-index: 10; color: #e8e2f5;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #title { top: 14px; left: 16px; pointer-events: none; }
  #title h1 { margin: 0; font-size: 20px; letter-spacing: 2px; font-weight: 600; color: #b49ae0; }
  #title p { margin: 4px 0 0; font-size: 12px; color: #9a8fb8; max-width: 340px; }
  #title .noise {
    display: inline-block; margin-top: 8px; font-size: 11px; letter-spacing: 1px; font-weight: 700;
    color: #0a0812; background: #b49ae0; border-radius: 6px; padding: 4px 10px;
  }
  #title a { color: #b49ae0; text-decoration: none; pointer-events: auto; }
  #stats {
    top: 14px; right: 16px; background: rgba(14, 10, 26, 0.72);
    border: 1px solid rgba(180, 154, 224, 0.28); border-radius: 10px;
    padding: 10px 14px; font-size: 12px; line-height: 1.7; min-width: 250px;
    backdrop-filter: blur(4px);
  }
  #stats .k { color: #9a8fb8; }
  #stats .v { color: #fff; font-variant-numeric: tabular-nums; }
  #stats .pos { color: #b49ae0; } #stats .neg { color: #8a94a6; } #stats .quiet { color: #9a8fb8; }
  #stats .warn { color: #f0a3a3; }
  #hint {
    bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #6d6390; pointer-events: none; white-space: nowrap;
  }
  #enterWrap { bottom: 42px; left: 50%; transform: translateX(-50%); }
  #enterLink {
    color: #e8e2f5; text-decoration: none; font-size: 15px; letter-spacing: 6px; font-weight: 600;
    padding: 10px 24px 10px 30px; border: 1px solid rgba(180, 154, 224, 0.4); border-radius: 999px;
    background: rgba(14, 10, 26, 0.6); backdrop-filter: blur(4px);
  }
  #enterLink:hover { border-color: #b49ae0; color: #fff; }
  #waiting {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 8, 18, 0.55); color: #d8cdf2; font-size: 15px; letter-spacing: 1px;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  #waiting.hidden { display: none; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  /* embed mode: slim chrome for iframes on the main page */
  body.embed #title, body.embed #hint { display: none; }
  body.embed #enterWrap { bottom: 14px; }
  body.embed #enterLink { font-size: 12px; padding: 7px 18px 7px 23px; }
  body.embed #stats { top: 8px; right: 8px; font-size: 11px; padding: 8px 10px; min-width: 0; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="scene"></div>
<div class="hud" id="title">
  <h1>SENTIMENT CLOUD</h1>
  <p>Sasha's live read of the crowd's mood about XRP — word-bubbles drift from her Reddit measurements. Lavender bubbles lean optimistic, slate bubbles lean fearful.</p>
  <span class="noise">⚠ NOISY EXPERIMENTAL READ</span>
</div>
<div class="hud" id="stats"></div>
<div class="hud" id="hint">drag to orbit · scroll to zoom</div>
<div class="hud" id="enterWrap"><a id="enterLink" href="index.html#sasha">SASHA'S LAB</a></div>
<div id="waiting"><span class="pulse">awaiting live data…</span></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- data ---------------- */
const REPO = 'MisoPrettyStacks/building-a-thing-with-infoflow';
const DATA_BASE = `https://raw.githubusercontent.com/${REPO}/data/`;
let live = null; // { bias, z, postsScanned, degraded, warmingUp, verdict, computedAt }

async function fetchSummary() {
  try {
    const r = await fetch(DATA_BASE + 'summary.json?m=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
    if (!r.ok) throw 0;
    const s = await r.json();
    const st = s.sentiment || {};
    let verdict = null;
    try {
      const vr = await fetch(DATA_BASE + 'sasha_supervisor.json?m=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
      if (vr.ok) { const vd = await vr.json(); verdict = vd.verdict || null; }
    } catch { /* verdict stays null */ }
    live = {
      bias: st.bias ?? 0,
      z: st.z ?? 0,
      postsScanned: st.postsScanned ?? 0,
      degraded: !!st.degraded,
      warmingUp: !!st.warmingUp,
      verdict,
      computedAt: s.generated_at,
    };
    document.getElementById('waiting').classList.add('hidden');
    refreshHud();
  } catch { /* keep last good state; overlay stays if never loaded */ }
}

function refreshHud() {
  const el = document.getElementById('stats');
  if (!live) { el.innerHTML = '<span class="k">waiting…</span>'; return; }
  const lean = live.z > 0 ? 'optimistic lean' : live.z < 0 ? 'fearful lean' : 'balanced';
  const cls = live.z > 0 ? 'pos' : live.z < 0 ? 'neg' : 'quiet';
  const status = live.degraded ? '<span class="warn">blind (feed down)</span>'
    : live.warmingUp ? '<span class="quiet">warming up</span>'
    : `<span class="${cls}">${lean}</span>`;
  el.innerHTML =
    `<div><span class="k">mood z-score</span> <span class="v ${cls}">${live.z >= 0 ? '+' : ''}${live.z.toFixed(2)}</span></div>` +
    `<div><span class="k">posts scanned</span> <span class="v">${live.postsScanned}</span></div>` +
    `<div><span class="k">mood</span> ${status}</div>` +
    `<div><span class="k">standing verdict</span> <span class="v">${live.verdict ? live.verdict : '—'}</span></div>` +
    `<div><span class="k">⚠ read quality</span> <span class="warn">noisy experimental</span></div>`;
}

/* ---------------- scene ---------------- */
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0812, 0.03);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 8, 24);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxDistance = 60; controls.minDistance = 8;

scene.add(new THREE.AmbientLight(0x99aabb, 0.5));
const key = new THREE.DirectionalLight(0xe8ddff, 1.1); key.position.set(10, 18, 8); scene.add(key);

// center: XRP lavender node
const xrpMat = new THREE.MeshStandardMaterial({ color: 0xb49ae0, emissive: 0x6a4fa3, emissiveIntensity: 1.3, roughness: 0.3 });
const xrp = new THREE.Mesh(new THREE.SphereGeometry(1.6, 48, 32), xrpMat);
scene.add(xrp);
const xrpGlow = new THREE.Mesh(
  new THREE.SphereGeometry(2.4, 32, 24),
  new THREE.MeshBasicMaterial({ color: 0xb49ae0, transparent: true, opacity: 0.13 })
);
scene.add(xrpGlow);

// word bubbles — ILLUSTRATIVE mood words (not the lab's proprietary lexicon),
// lavender for optimistic-leaning, slate for fearful-leaning.
const POS_WORDS = ['moon', 'hype', 'bullish', 'fomo', 'pump', 'green', 'rally', 'lambo', 'gem', 'hodl', 'breakout', 'accumulate', 'adoption', 'ath', 'strong', 'bounce', 'optimism', 'diamond'];
const NEG_WORDS = ['fear', 'dump', 'panic', 'fud', 'crash', 'red', 'bearish', 'scam', 'capitulation', 'bleed', 'rug', 'fraud', 'selloff', 'warning', 'bubble', 'collapse', 'doubt', 'weak'];

function makeBubble(text, colorCss) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const font = '600 44px ui-sans-serif, system-ui, sans-serif';
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + 56;
  c.width = w; c.height = 96;
  const g = ctx; g.font = font;
  // rounded bubble
  const r = 34;
  g.beginPath();
  g.moveTo(r, 6); g.lineTo(w - r, 6); g.quadraticCurveTo(w - 6, 6, w - 6, r);
  g.lineTo(w - 6, 96 - r); g.quadraticCurveTo(w - 6, 96 - 6, w - r, 96 - 6);
  g.lineTo(r, 96 - 6); g.quadraticCurveTo(6, 96 - 6, 6, 96 - r);
  g.lineTo(6, r); g.quadraticCurveTo(6, 6, r, 6); g.closePath();
  g.fillStyle = 'rgba(10,8,18,0.55)'; g.fill();
  g.strokeStyle = colorCss; g.globalAlpha = 0.85; g.lineWidth = 3; g.stroke();
  g.globalAlpha = 1; g.fillStyle = colorCss; g.textBaseline = 'middle';
  g.fillText(text, 28, 52);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.9, depthWrite: false });
  const spr = new THREE.Sprite(mat);
  const h = 1.1;
  spr.scale.set(h * (w / 96), h, 1);
  return spr;
}

const bubbles = [];
const BUBBLE_N = 40;
for (let i = 0; i < BUBBLE_N; i++) {
  const positive = i % 2 === 0;
  const word = positive ? POS_WORDS[(i / 2 | 0) % POS_WORDS.length] : NEG_WORDS[(i / 2 | 0) % NEG_WORDS.length];
  const spr = makeBubble(word, positive ? '#c9b3ec' : '#8a94a6');
  const a = Math.random() * Math.PI * 2;
  const rad = 5 + Math.random() * 9;
  spr.position.set(Math.cos(a) * rad, (Math.random() - 0.5) * 10, Math.sin(a) * rad);
  spr.userData = {
    positive,
    baseY: spr.position.y,
    phase: Math.random() * Math.PI * 2,
    speed: 0.25 + Math.random() * 0.5,
    sway: 0.4 + Math.random() * 0.8,
    rot: (Math.random() - 0.5) * 0.4,
  };
  scene.add(spr);
  bubbles.push(spr);
}

// faint drifting dust
const P_COUNT = 250;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(P_COUNT * 3);
const pSeed = [];
for (let i = 0; i < P_COUNT; i++) {
  const a = Math.random() * Math.PI * 2, rad = 4 + Math.random() * 14;
  pPos[i * 3] = Math.cos(a) * rad; pPos[i * 3 + 1] = (Math.random() - 0.5) * 14; pPos[i * 3 + 2] = Math.sin(a) * rad;
  pSeed.push({ speed: 0.1 + Math.random() * 0.3, phase: Math.random() * Math.PI * 2 });
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ color: 0xb49ae0, size: 0.14, transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending });
scene.add(new THREE.Points(pGeo, pMat));

/* ---------------- animation ---------------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;

  xrp.position.y = Math.sin(t * 0.8) * 0.25;
  xrpGlow.position.copy(xrp.position);

  // mood drives the cloud: positive z lifts optimistic bubbles, negative z sinks them
  const z = live ? Math.max(-3, Math.min(3, live.z)) : 0;
  for (const b of bubbles) {
    const u = b.userData;
    const dir = u.positive ? 1 : -1;
    u.baseY += dt * u.speed * 0.6 * dir * (1 + Math.abs(z) * 0.4);
    if (u.baseY > 9) u.baseY = -9;
    if (u.baseY < -9) u.baseY = 9;
    b.position.y = u.baseY + Math.sin(t * u.speed + u.phase) * u.sway * 0.5;
    b.position.x += Math.sin(t * 0.3 + u.phase) * dt * 0.25;
    b.material.rotation = Math.sin(t * 0.2 + u.phase) * u.rot * 0.3;
    // decisive mood: the leaning side glows a touch brighter
    const lean = (u.positive && z > 0.5) || (!u.positive && z < -0.5);
    b.material.opacity = lean ? 1.0 : 0.72;
  }

  const pos = pGeo.attributes.position.array;
  for (let i = 0; i < P_COUNT; i++) {
    const s = pSeed[i];
    pos[i * 3 + 1] += Math.sin(t * 0.5 + s.phase) * dt * s.speed;
  }
  pGeo.attributes.position.needsUpdate = true;

  const excite = live ? Math.min(1 + Math.abs(live.z) * 0.25, 2) : 1;
  xrpMat.emissiveIntensity = 1.0 + 0.4 * Math.sin(t * 1.6) * excite * 0.5 + (excite - 1) * 0.6;

  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
await fetchSummary();
setInterval(fetchSummary, 30000);
animate();
</script>
</body>
</html>
