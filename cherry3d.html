<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Correlation Regime — live 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
  #scene { position: fixed; inset: 0; }
  .hud {
    position: fixed; z-index: 10; color: #dfe8f5;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #title { top: 14px; left: 16px; pointer-events: none; }
  #title h1 { margin: 0; font-size: 20px; letter-spacing: 2px; font-weight: 600; color: #dc2645; }
  #title p { margin: 4px 0 0; font-size: 12px; color: #8fa0bd; max-width: 340px; }
  #title a { color: #dc2645; text-decoration: none; pointer-events: auto; }
  #stats {
    top: 14px; right: 16px; background: rgba(10, 16, 28, 0.72);
    border: 1px solid rgba(220, 38, 69, 0.28); border-radius: 10px;
    padding: 10px 14px; font-size: 12px; line-height: 1.7; min-width: 250px;
    backdrop-filter: blur(4px);
  }
  #stats .k { color: #8fa0bd; }
  #stats .v { color: #fff; font-variant-numeric: tabular-nums; }
  #stats .cp { color: #ff7d99; } #stats .dc { color: #8fa0bd; } #stats .warm { color: #f2c879; }
  #hint {
    bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #5d6f8f; pointer-events: none; white-space: nowrap;
  }
  #enterWrap { bottom: 42px; left: 50%; transform: translateX(-50%); }
  #enterLink {
    color: #dfe8f5; text-decoration: none; font-size: 15px; letter-spacing: 6px; font-weight: 600;
    padding: 10px 24px 10px 30px; border: 1px solid rgba(220, 38, 69, 0.45); border-radius: 999px;
    background: rgba(10, 16, 28, 0.6); backdrop-filter: blur(4px);
  }
  #enterLink:hover { border-color: #dc2645; color: #fff; }
  #waiting {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 7, 13, 0.55); color: #cfe0ff; font-size: 15px; letter-spacing: 1px;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  #waiting.hidden { display: none; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  /* embed mode: slim chrome for iframes on the main page */
  body.embed #title, body.embed #hint { display: none; }
  body.embed #enterWrap { bottom: 14px; }
  body.embed #enterLink { font-size: 12px; padding: 7px 18px 7px 23px; }
  body.embed #stats { top: 8px; right: 8px; font-size: 11px; padding: 8px 10px; min-width: 0; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="scene"></div>
<div class="hud" id="title">
  <h1>CORRELATION REGIME</h1>
  <p>Cherry's live view of the XRP/BTC coupling. The crimson beam between the two nodes is the rolling correlation — thick and glowing when coupled, fading when the pair decouples.</p>
</div>
<div class="hud" id="stats"></div>
<div class="hud" id="hint">drag to orbit · scroll to zoom</div>
<div class="hud" id="enterWrap"><a id="enterLink" href="index.html#cherry">CHERRY'S LAB</a></div>
<div id="waiting"><span class="pulse">awaiting live data…</span></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- data ---------------- */
const REPO = 'MisoPrettyStacks/building-a-thing-with-infoflow';
const DATA_BASE = `https://raw.githubusercontent.com/${REPO}/data/`;
let live = null; // { corr24h, coupled, bias, warmingUp, degraded, verdict, computedAt }

async function fetchSummary() {
  try {
    const r = await fetch(DATA_BASE + 'summary.json?m=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
    if (!r.ok) throw 0;
    const s = await r.json();
    const cc = s.corr || {};
    let verdict = null;
    try {
      const rv = await fetch(DATA_BASE + 'cherry_supervisor.json?m=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
      if (rv.ok) verdict = (await rv.json()).verdict || null;
    } catch { /* supervisor file optional */ }
    live = {
      corr24h: typeof cc.corr24h === 'number' ? cc.corr24h : null,
      coupled: !!cc.coupled,
      bias: cc.bias ?? 0,
      warmingUp: !!cc.warmingUp,
      degraded: !!cc.degraded,
      verdict,
      computedAt: s.generated_at,
    };
    document.getElementById('waiting').classList.add('hidden');
    refreshHud();
  } catch { /* keep last good state; overlay stays if never loaded */ }
}

function refreshHud() {
  const el = document.getElementById('stats');
  if (!live) { el.innerHTML = '<span class="k">waiting…</span>'; return; }
  const stCls = live.degraded ? 'dc' : live.warmingUp ? 'warm' : live.coupled ? 'cp' : 'dc';
  const stTxt = live.degraded ? 'blind (data down)' : live.warmingUp ? 'warming up' : live.coupled ? 'COUPLED' : 'decoupled';
  const tiltTxt = live.degraded || live.warmingUp ? '—'
    : live.bias > 0.0005 ? 'bullish tilt' : live.bias < -0.0005 ? 'bearish tilt' : 'no tilt';
  el.innerHTML =
    `<div><span class="k">24h correlation</span> <span class="v ${stCls}">${live.corr24h != null ? live.corr24h.toFixed(3) : '—'}</span></div>` +
    `<div><span class="k">regime</span> <span class="v ${stCls}">${stTxt}</span></div>` +
    `<div><span class="k">tilt</span> <span class="v ${stCls}">${live.bias >= 0 ? '+' : ''}${live.bias.toFixed(4)} <span class="${stCls}">${tiltTxt}</span></span></div>` +
    `<div><span class="k">verdict</span> <span class="v">${live.verdict || '—'}</span></div>`;
}

/* ---------------- scene ---------------- */
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070d, 0.022);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 10, 30);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxDistance = 70; controls.minDistance = 10;

scene.add(new THREE.AmbientLight(0x8899bb, 0.5));
const key = new THREE.DirectionalLight(0xffe0e6, 1.1); key.position.set(10, 18, 8); scene.add(key);

// BTC node (left, orange) and XRP node (right, silver/blue)
const btcMat = new THREE.MeshStandardMaterial({ color: 0xf7931a, emissive: 0x8a4a0a, emissiveIntensity: 1.2, roughness: 0.3 });
const btc = new THREE.Mesh(new THREE.SphereGeometry(2.0, 48, 32), btcMat);
btc.position.set(-9, 0, 0);
scene.add(btc);
const xrpMat = new THREE.MeshStandardMaterial({ color: 0x9ecfff, emissive: 0x2a4a66, emissiveIntensity: 1.2, roughness: 0.3 });
const xrp = new THREE.Mesh(new THREE.SphereGeometry(2.0, 48, 32), xrpMat);
xrp.position.set(9, 0, 0);
scene.add(xrp);

function makeLabel(text, color) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
  const g = cv.getContext('2d');
  g.font = '600 34px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = color; g.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(cv);
  const m = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const sp = new THREE.Sprite(m); sp.scale.set(7, 1.75, 1);
  return sp;
}
const btcLabel = makeLabel('BTC', '#f7931a'); btcLabel.position.set(-9, 3.4, 0); scene.add(btcLabel);
const xrpLabel = makeLabel('XRP', '#9ecfff'); xrpLabel.position.set(9, 3.4, 0); scene.add(xrpLabel);

// the coupling beam: BTC -> XRP, crimson; thickness/glow = correlation, fades when decoupled
const beamGroup = new THREE.Group(); scene.add(beamGroup);
const beamMat = new THREE.MeshBasicMaterial({ color: 0xdc2645, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
const beamGlowMat = new THREE.MeshBasicMaterial({ color: 0xdc2645, transparent: true, opacity: 0.18, blending: THREE.AdditiveBlending, depthWrite: false });
let beam = null, beamGlow = null;
function rebuildBeam() {
  while (beamGroup.children.length) {
    const c = beamGroup.children.pop();
    c.geometry.dispose(); // materials shared, kept
  }
  const corr = live && live.corr24h != null ? Math.max(0, Math.min(1, live.corr24h)) : 0;
  const width = 0.08 + corr * 0.9;             // thickness scales with correlation
  const lift = 1.2 + corr * 2.4;               // coupled arcs ride higher
  const a = btc.position.clone(), b = xrp.position.clone();
  const mid = a.clone().add(b).multiplyScalar(0.5); mid.y += lift;
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  beam = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, width, 10, false), beamMat);
  beamGlow = new THREE.Mesh(new THREE.TubeGeometry(curve, 32, width * 2.6, 10, false), beamGlowMat);
  beamGroup.add(beam); beamGroup.add(beamGlow);
}
rebuildBeam();

// drifting sparks along the beam direction when coupled
const SPARKS = 160;
const sGeo = new THREE.BufferGeometry();
const sPos = new Float32Array(SPARKS * 3);
const sSeed = [];
for (let i = 0; i < SPARKS; i++) sSeed.push({ t: Math.random(), speed: 0.1 + Math.random() * 0.4, lane: (Math.random() - 0.5) * 1.4 });
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
const sMat = new THREE.PointsMaterial({ color: 0xff7d99, size: 0.24, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending });
const sparks = new THREE.Points(sGeo, sMat);
scene.add(sparks);

/* ---------------- animation ---------------- */
const clock = new THREE.Clock();
let lastCorrShown = null;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;

  const corr = live && live.corr24h != null && !live.degraded && !live.warmingUp ? Math.max(0, Math.min(1, live.corr24h)) : 0;
  const coupled = live ? live.coupled && !live.degraded && !live.warmingUp : false;
  if (lastCorrShown == null || Math.abs(corr - lastCorrShown) > 0.02) { rebuildBeam(); lastCorrShown = corr; }

  // beam breathes with coupling; fades hard when decoupled
  const target = coupled ? 0.55 + corr * 0.45 : 0.06;
  beamMat.opacity += (target - beamMat.opacity) * Math.min(1, dt * 3);
  beamGlowMat.opacity = beamMat.opacity * 0.22;
  const shimmer = 0.08 * Math.sin(t * 2.4) * (coupled ? 1 : 0);
  beamMat.opacity = Math.max(0.02, Math.min(1, beamMat.opacity + shimmer));

  // sparks travel the bridge when coupled, drift faintly when decoupled
  sMat.opacity = coupled ? 0.5 + corr * 0.5 : 0.10;
  const pos = sGeo.attributes.position.array;
  for (let i = 0; i < SPARKS; i++) {
    const s = sSeed[i];
    s.t += dt * s.speed * (coupled ? 0.6 + corr * 1.4 : 0.25);
    if (s.t > 1) s.t -= 1;
    const x = -9 + s.t * 18;
    const y = Math.sin(s.t * Math.PI) * (1.2 + corr * 2.4) + s.lane * Math.sin(s.t * Math.PI) * 0.5;
    pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = s.lane * 0.8;
  }
  sGeo.attributes.position.needsUpdate = true;

  // nodes breathe
  btc.position.y = Math.sin(t * 0.7) * 0.25;
  xrp.position.y = Math.sin(t * 0.7 + 1.3) * 0.25;
  btcLabel.position.y = btc.position.y + 3.4;
  xrpLabel.position.y = xrp.position.y + 3.4;
  btcMat.emissiveIntensity = 1.0 + 0.3 * Math.sin(t * 1.4);
  xrpMat.emissiveIntensity = 1.0 + 0.3 * Math.sin(t * 1.4 + 2.1);

  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
await fetchSummary();
setInterval(fetchSummary, 30000);
animate();
</script>
</body>
</html>
