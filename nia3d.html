<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Catalysts — live 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0705; }
  #scene { position: fixed; inset: 0; }
  .hud {
    position: fixed; z-index: 10; color: #eef1f7;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #title { top: 14px; left: 16px; pointer-events: none; }
  #title h1 { margin: 0; font-size: 20px; letter-spacing: 2px; font-weight: 600; color: #fb923c; }
  #title p { margin: 4px 0 0; font-size: 12px; color: #a99f8f; max-width: 360px; }
  #title a { color: #fb923c; text-decoration: none; pointer-events: auto; }
  #stats {
    top: 14px; right: 16px; background: rgba(20, 14, 8, 0.72);
    border: 1px solid rgba(251, 146, 60, 0.25); border-radius: 10px;
    padding: 10px 14px; font-size: 12px; line-height: 1.7; min-width: 260px; max-width: 340px;
    backdrop-filter: blur(4px);
  }
  #stats .k { color: #a99f8f; }
  #stats .v { color: #fff; font-variant-numeric: tabular-nums; }
  #stats .pos { color: #8fe3a8; } #stats .neg { color: #ff9d6b; } #stats .quiet { color: #a99f8f; }
  #stats .cat { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 310px; }
  #hint {
    bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #7d7263; pointer-events: none; white-space: nowrap;
  }
  #enterWrap { bottom: 42px; left: 50%; transform: translateX(-50%); }
  #enterLink {
    color: #eef1f7; text-decoration: none; font-size: 15px; letter-spacing: 6px; font-weight: 600;
    padding: 10px 24px 10px 30px; border: 1px solid rgba(251, 146, 60, 0.35); border-radius: 999px;
    background: rgba(20, 14, 8, 0.6); backdrop-filter: blur(4px);
  }
  #enterLink:hover { border-color: #fb923c; color: #fff; }
  #waiting {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 7, 5, 0.55); color: #ffd9b3; font-size: 15px; letter-spacing: 1px;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  #waiting.hidden { display: none; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  /* embed mode: slim chrome for iframes on the main page */
  body.embed #title, body.embed #hint { display: none; }
  body.embed #enterWrap { bottom: 14px; }
  body.embed #enterLink { font-size: 12px; padding: 7px 18px 7px 23px; }
  body.embed #stats { top: 8px; right: 8px; font-size: 11px; padding: 8px 10px; min-width: 0; max-width: 260px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="scene"></div>
<div class="hud" id="title">
  <h1>NEWS CATALYSTS</h1>
  <p>Live crypto headlines, watched by Nia. Orbiting satellites are active XRP catalysts — brightness is how fresh they are, color is the direction they push.</p>
</div>
<div class="hud" id="stats"></div>
<div class="hud" id="hint">drag to orbit · scroll to zoom</div>
<div class="hud" id="enterWrap"><a id="enterLink" href="index.html#nia">NIA'S LAB</a></div>
<div id="waiting"><span class="pulse">awaiting live data…</span></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- data ---------------- */
const REPO = 'MisoPrettyStacks/building-a-thing-with-infoflow';
const DATA_BASE = `https://raw.githubusercontent.com/${REPO}/data/`;
let live = null; // { bias, actives:[{headline,dir,weight}], degraded, warmingUp, verdict, computedAt }
let verdict = null;

async function fetchSummary() {
  try {
    const r = await fetch(DATA_BASE + 'summary.json?m=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
    if (!r.ok) throw 0;
    const s = await r.json();
    const nw = s.news || {};
    live = {
      bias: nw.bias ?? 0,
      actives: Array.isArray(nw.activeCatalysts) ? nw.activeCatalysts.slice(-10) : [],
      degraded: !!nw.degraded,
      warmingUp: !!nw.warmingUp,
      catalysts24h: nw.catalysts24h ?? 0,
      computedAt: s.generated_at,
    };
    document.getElementById('waiting').classList.add('hidden');
    refreshHud();
    refreshSatellites();
  } catch { /* keep last good state; overlay stays if never loaded */ }
}

async function fetchVerdict() {
  try {
    const r = await fetch(DATA_BASE + 'nia_supervisor.json?m=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
    if (!r.ok) return;
    const doc = await r.json();
    verdict = doc && doc.verdict ? doc.verdict : null;
    refreshHud();
  } catch { /* verdict stays unknown */ }
}

const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

function refreshHud() {
  const el = document.getElementById('stats');
  if (!live) { el.innerHTML = '<span class="k">waiting…</span>'; return; }
  const tilt = live.bias > 0.0005 ? 'upbeat' : live.bias < -0.0005 ? 'worrying' : 'quiet';
  const cls = live.bias > 0.0005 ? 'pos' : live.bias < -0.0005 ? 'neg' : 'quiet';
  const status = live.degraded ? '<span class="neg">wire blind</span>'
    : live.warmingUp ? '<span class="quiet">warming up</span>'
    : `<span class="${cls}">${tilt}</span>`;
  const cats = live.actives.slice(0, 4).map((a) =>
    `<span class="cat"><span class="${a.dir > 0 ? 'pos' : 'neg'}">${a.dir > 0 ? '▲' : '▼'}</span> <span class="v">${esc(a.headline.length > 64 ? a.headline.slice(0, 64) + '…' : a.headline)}</span></span>`
  ).join('');
  el.innerHTML =
    `<div><span class="k">news tilt</span> <span class="v ${cls}">${live.bias >= 0 ? '+' : ''}${live.bias.toFixed(4)}</span> <span class="${cls}">${tilt}</span></div>` +
    `<div><span class="k">active catalysts</span> <span class="v">${live.actives.length}</span></div>` +
    (cats || '<div><span class="k">wire quiet — no catalysts live</span></div>') +
    `<div><span class="k">status</span> ${status}</div>` +
    `<div><span class="k">verdict</span> <span class="v">${verdict || '—'}</span></div>`;
}

/* ---------------- scene ---------------- */
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0705, 0.028);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 14, 26);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxDistance = 60; controls.minDistance = 8;

scene.add(new THREE.AmbientLight(0xbb99aa, 0.5));
const key = new THREE.DirectionalLight(0xffe4cc, 1.1); key.position.set(10, 18, 8); scene.add(key);

// center: XRP orange core
const ORANGE = 0xfb923c;
const xrpMat = new THREE.MeshStandardMaterial({ color: ORANGE, emissive: 0xa85a1a, emissiveIntensity: 1.4, roughness: 0.3 });
const xrp = new THREE.Mesh(new THREE.SphereGeometry(1.6, 48, 32), xrpMat);
scene.add(xrp);
const xrpGlow = new THREE.Mesh(
  new THREE.SphereGeometry(2.4, 32, 24),
  new THREE.MeshBasicMaterial({ color: ORANGE, transparent: true, opacity: 0.14 })
);
scene.add(xrpGlow);

// faint orbit guide
const ORBIT_R = 10;
const ringGeo = new THREE.TorusGeometry(ORBIT_R, 0.03, 8, 128);
const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x5a3a24, transparent: true, opacity: 0.5 }));
ring.rotation.x = Math.PI / 2; scene.add(ring);

// headline satellites (rebuilt from live catalysts)
const satGroup = new THREE.Group(); scene.add(satGroup);
function refreshSatellites() {
  while (satGroup.children.length) {
    const c = satGroup.children.pop();
    c.geometry.dispose(); c.material.dispose();
  }
  if (!live) return;
  live.actives.forEach((a, i) => {
    const w = Math.max(0, Math.min(1, a.weight || 0));
    const size = 0.35 + w * 0.55;
    const color = a.dir > 0 ? 0x8fe3a8 : 0xff9d6b;
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35 + w * 0.65 });
    const sat = new THREE.Mesh(new THREE.SphereGeometry(size, 24, 18), mat);
    sat.userData = {
      angle: (i / Math.max(1, live.actives.length)) * Math.PI * 2 + Math.random() * 0.5,
      speed: 0.12 + w * 0.25 + Math.random() * 0.08,
      tilt: (Math.sin(i * 2.7) * 2.0),
      brightness: w,
      phase: Math.random() * Math.PI * 2,
    };
    // glow shell: brightness scales with catalyst weight
    const shell = new THREE.Mesh(
      new THREE.SphereGeometry(size * 1.9, 20, 14),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.05 + w * 0.22, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    sat.add(shell);
    satGroup.add(sat);
  });
}

// news particles: drifting motes colored by the net tilt
const P_COUNT = 500;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(P_COUNT * 3);
const pSeed = [];
for (let i = 0; i < P_COUNT; i++) {
  const a = Math.random() * Math.PI * 2, r = 4 + Math.random() * 14;
  pSeed.push({ a, r, y: (Math.random() - 0.5) * 10, speed: 0.05 + Math.random() * 0.2 });
  pPos[i * 3] = Math.cos(a) * r; pPos[i * 3 + 1] = pSeed[i].y; pPos[i * 3 + 2] = Math.sin(a) * r;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ color: ORANGE, size: 0.18, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending });
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

/* ---------------- animation ---------------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;

  xrp.position.y = Math.sin(t * 0.8) * 0.25;
  xrpGlow.position.copy(xrp.position);

  const bias = live ? live.bias : 0;
  const strength = live ? Math.min(Math.abs(bias) / 0.004, 1) : 0;

  // net tilt colors the core and the motes
  pMat.color.setHex(bias > 0.0005 ? 0x8fe3a8 : bias < -0.0005 ? 0xff9d6b : ORANGE);
  pMat.opacity = 0.25 + strength * 0.55;

  // satellites orbit; brighter = fresher catalyst
  satGroup.children.forEach((sat) => {
    const u = sat.userData;
    u.angle += dt * u.speed * (0.5 + strength);
    const r = ORBIT_R + Math.sin(t * 0.6 + u.phase) * 0.8;
    sat.position.set(Math.cos(u.angle) * r, u.tilt + Math.sin(t * 0.9 + u.phase) * 0.6, Math.sin(u.angle) * r);
    sat.material.opacity = (0.35 + u.brightness * 0.65) * (0.8 + 0.2 * Math.sin(t * 2.4 + u.phase));
  });

  // core breathes with catalyst activity
  const n = live ? live.actives.length : 0;
  const excite = Math.min(1 + n * 0.25 + strength * 0.5, 2.2);
  xrpMat.emissiveIntensity = 1.1 + 0.5 * Math.sin(t * 1.6) * excite * 0.5 + (excite - 1) * 0.8;

  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
await fetchSummary();
await fetchVerdict();
setInterval(fetchSummary, 30000);
setInterval(fetchVerdict, 60000);
animate();
</script>
</body>
</html>
