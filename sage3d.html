<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stablecoin Flow — live 3D liquidity rendering</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
  #scene { position: fixed; inset: 0; }
  .hud {
    position: fixed; z-index: 10; color: #dfe8f5;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #title { top: 14px; left: 16px; pointer-events: none; }
  #title h1 { margin: 0; font-size: 20px; letter-spacing: 2px; font-weight: 600; color: #8aa888; }
  #title p { margin: 4px 0 0; font-size: 12px; color: #8fa0bd; max-width: 340px; }
  #title a { color: #8aa888; text-decoration: none; pointer-events: auto; }
  #stats {
    top: 14px; right: 16px; background: rgba(10, 16, 28, 0.72);
    border: 1px solid rgba(138, 168, 136, 0.25); border-radius: 10px;
    padding: 10px 14px; font-size: 12px; line-height: 1.7; min-width: 240px;
    backdrop-filter: blur(4px);
  }
  #stats .k { color: #8fa0bd; }
  #stats .v { color: #fff; font-variant-numeric: tabular-nums; }
  #stats .up { color: #9be0a8; } #stats .down { color: #f0a8a8; } #stats .quiet { color: #8fa0bd; }
  #hint {
    bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #5d6f8f; pointer-events: none; white-space: nowrap;
  }
  #enterWrap { bottom: 42px; left: 50%; transform: translateX(-50%); }
  #enterLink {
    color: #dfe8f5; text-decoration: none; font-size: 15px; letter-spacing: 6px; font-weight: 600;
    padding: 10px 24px 10px 30px; border: 1px solid rgba(138, 168, 136, 0.38); border-radius: 999px;
    background: rgba(10, 16, 28, 0.6); backdrop-filter: blur(4px);
  }
  #enterLink:hover { border-color: #8aa888; color: #fff; }
  #waiting {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 7, 13, 0.55); color: #cfe0ff; font-size: 15px; letter-spacing: 1px;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  #waiting.hidden { display: none; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  /* embed mode: slim chrome for iframes on the main page */
  body.embed #title, body.embed #hint { display: none; }
  body.embed #enterWrap { bottom: 14px; }
  body.embed #enterLink { font-size: 12px; padding: 7px 18px 7px 23px; }
  body.embed #stats { top: 8px; right: 8px; font-size: 11px; padding: 8px 10px; min-width: 0; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="scene"></div>
<div class="hud" id="title">
  <h1>STABLECOIN FLOW</h1>
  <p>Sage's live view of the crypto liquidity tide. The pool level rises and falls with USDT + USDC 24h supply change; the green streams are the inflows feeding it.</p>
</div>
<div class="hud" id="stats"></div>
<div class="hud" id="hint">drag to orbit · scroll to zoom</div>
<div class="hud" id="enterWrap"><a id="enterLink" href="index.html#sage">SAGE'S LAB</a></div>
<div id="waiting"><span class="pulse">awaiting live data…</span></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- data ---------------- */
const REPO = 'MisoPrettyStacks/building-a-thing-with-infoflow';
const DATA_BASE = `https://raw.githubusercontent.com/${REPO}/data/`;
let live = null; // { bias, totalChange, usdtChange24h, usdcChange24h, degraded, warmingUp, cached, staleNote, weight, verdict }
let verdictDoc = null;

async function fetchSummary() {
  try {
    const r = await fetch(DATA_BASE + 'summary.json?m=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
    if (!r.ok) throw 0;
    const s = await r.json();
    const st = s.stable || {};
    live = {
      bias: st.bias ?? 0,
      totalChange: st.totalChange ?? null,
      usdtChange24h: st.usdtChange24h ?? null,
      usdcChange24h: st.usdcChange24h ?? null,
      degraded: !!st.degraded,
      warmingUp: !!st.warmingUp,
      cached: !!st.cached,
      staleNote: st.staleNote || null,
      weight: st.weight ?? 0,
      computedAt: s.generated_at,
    };
    document.getElementById('waiting').classList.add('hidden');
    refreshHud();
  } catch { /* keep last good state; overlay stays if never loaded */ }
  try {
    const r2 = await fetch(DATA_BASE + 'sage_supervisor.json?m=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
    if (r2.ok) { verdictDoc = await r2.json(); refreshHud(); }
  } catch { /* verdict is a nice-to-have */ }
}

function fmtPct(x) {
  if (x == null || !isFinite(x)) return '—';
  return (x >= 0 ? '+' : '') + x.toFixed(2) + '%';
}

function refreshHud() {
  const el = document.getElementById('stats');
  if (!live) { el.innerHTML = '<span class="k">waiting…</span>'; return; }
  const tc = live.totalChange;
  const dir = tc != null ? (tc > 0.05 ? 'entering' : tc < -0.05 ? 'leaving' : 'calm') : '—';
  const cls = tc != null ? (tc > 0.05 ? 'up' : tc < -0.05 ? 'down' : 'quiet') : 'quiet';
  const status = live.degraded ? '<span class="down">blind (feed down)</span>'
    : live.warmingUp ? '<span class="quiet">warming up</span>'
    : live.staleNote ? `<span class="quiet">cached read</span>`
    : `<span class="${cls}">${dir}</span>`;
  const verdict = verdictDoc && verdictDoc.verdict
    ? (verdictDoc.verdict === 'APPLY_CANDIDATE' ? 'APPLY' : verdictDoc.verdict)
    : '—';
  el.innerHTML =
    `<div><span class="k">supply change · 24h</span> <span class="v ${cls}">${fmtPct(tc)}</span></div>` +
    `<div><span class="k">liquidity tilt</span> <span class="v ${cls}">${live.bias >= 0 ? '+' : ''}${live.bias.toFixed(4)}</span> <span class="${cls}">${dir}</span></div>` +
    `<div><span class="k">USDT / USDC</span> <span class="v">${fmtPct(live.usdtChange24h)} / ${fmtPct(live.usdcChange24h)}</span></div>` +
    `<div><span class="k">verdict</span> <span class="v">${verdict}</span></div>` +
    `<div><span class="k">status</span> ${status}</div>`;
}

/* ---------------- scene ---------------- */
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070d, 0.028);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 14, 26);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxDistance = 60; controls.minDistance = 8;

scene.add(new THREE.AmbientLight(0x8899bb, 0.5));
const key = new THREE.DirectionalLight(0xf2f8ec, 1.1); key.position.set(10, 18, 8); scene.add(key);

// pool: stone basin (torus rim + floor) and a living water surface
const POOL_R = 9;
const SAGE_GREEN = 0x8aa888;
const rim = new THREE.Mesh(
  new THREE.TorusGeometry(POOL_R, 0.55, 16, 96),
  new THREE.MeshStandardMaterial({ color: 0x2b3644, roughness: 0.6, metalness: 0.2 })
);
rim.rotation.x = Math.PI / 2; rim.position.y = 0.2; scene.add(rim);
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(POOL_R - 0.2, 64),
  new THREE.MeshStandardMaterial({ color: 0x111826, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2; floor.position.y = -2.2; scene.add(floor);
const waterMat = new THREE.MeshStandardMaterial({
  color: SAGE_GREEN, transparent: true, opacity: 0.72,
  emissive: 0x334e33, emissiveIntensity: 0.55, roughness: 0.25,
});
const water = new THREE.Mesh(new THREE.CircleGeometry(POOL_R - 0.3, 64), waterMat);
water.rotation.x = -Math.PI / 2; water.position.y = 0;
scene.add(water);
// soft glow under the water
const waterGlow = new THREE.Mesh(
  new THREE.CircleGeometry(POOL_R - 0.5, 48),
  new THREE.MeshBasicMaterial({ color: SAGE_GREEN, transparent: true, opacity: 0.10 })
);
waterGlow.rotation.x = -Math.PI / 2; waterGlow.position.y = -2.0; scene.add(waterGlow);

// hovering liquidity orb — the tide's mood
const orbMat = new THREE.MeshStandardMaterial({ color: SAGE_GREEN, emissive: 0x4a6b45, emissiveIntensity: 1.2, roughness: 0.3 });
const orb = new THREE.Mesh(new THREE.SphereGeometry(1.1, 32, 24), orbMat);
orb.position.set(0, 6.4, 0); scene.add(orb);
const orbGlow = new THREE.Mesh(
  new THREE.SphereGeometry(1.7, 32, 24),
  new THREE.MeshBasicMaterial({ color: SAGE_GREEN, transparent: true, opacity: 0.12 })
);
orbGlow.position.copy(orb.position); scene.add(orbGlow);

// USDT + USDC inflow streams: particle columns falling into the pool
function makeStream(x, color, count) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const seed = [];
  for (let i = 0; i < count; i++) {
    seed.push({ t: Math.random(), speed: 0.5 + Math.random() * 0.9, jx: (Math.random() - 0.5) * 0.9, jz: (Math.random() - 0.5) * 0.9 });
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color, size: 0.28, transparent: true, opacity: 0.85, depthWrite: false, blending: THREE.AdditiveBlending });
  const pts = new THREE.Points(geo, mat);
  pts.userData = { seed, x, top: 10 };
  scene.add(pts);
  return pts;
}
const usdtStream = makeStream(-3.4, 0x8aa888, 320);  // USDT — sage
const usdcStream = makeStream(3.4, 0xc4e0c0, 320);   // USDC — lighter leaf

// faint compass ticks around the rim for scale
const tickMat = new THREE.MeshBasicMaterial({ color: 0x3a4a5e, transparent: true, opacity: 0.6 });
for (let i = 0; i < 24; i++) {
  const a = (i / 24) * Math.PI * 2;
  const tick = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.9), tickMat);
  tick.position.set(Math.cos(a) * (POOL_R + 1.3), 0.2, Math.sin(a) * (POOL_R + 1.3));
  tick.rotation.y = -a;
  scene.add(tick);
}

/* ---------------- animation ---------------- */
const clock = new THREE.Clock();
const BASE_LEVEL = 0.0, MAX_LIFT = 1.4;
function targetLevel() {
  // the pool breathes with the 24h supply change: ±1.5% change = full lift/drop
  if (!live || live.totalChange == null) return BASE_LEVEL;
  const k = Math.max(-1, Math.min(1, live.totalChange / 1.5));
  return BASE_LEVEL + k * MAX_LIFT;
}
let level = BASE_LEVEL;

function updateStream(stream, change, dt) {
  const strength = change == null ? 0.15 : Math.min(Math.abs(change) / 1.5, 1);
  stream.material.opacity = 0.25 + strength * 0.65;
  const { seed, x, top } = stream.userData;
  const pos = stream.geometry.attributes.position.array;
  const surface = level;
  for (let i = 0; i < seed.length; i++) {
    const s = seed[i];
    s.t += dt * s.speed * (0.35 + strength * 1.5);
    if (s.t > 1) s.t -= 1;
    const y = top - s.t * (top - surface);
    pos[i * 3] = x + s.jx;
    pos[i * 3 + 1] = y;
    pos[i * 3 + 2] = s.jz;
  }
  stream.geometry.attributes.position.needsUpdate = true;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;

  // the water level eases toward the live supply read
  level += (targetLevel() - level) * Math.min(dt * 1.2, 1);
  water.position.y = level;
  water.position.x = Math.sin(t * 0.6) * 0.06; // faint shimmer sway
  waterMat.emissiveIntensity = 0.4 + 0.25 * Math.sin(t * 1.1) + (live && live.bias > 0.0005 ? 0.15 : 0);

  // orb floats; its glow tracks the tilt direction
  orb.position.y = 6.4 + Math.sin(t * 0.7) * 0.3;
  orbGlow.position.copy(orb.position);
  const tc = live ? live.totalChange : null;
  orbMat.color.setHex(tc != null && tc < -0.05 ? 0x9db08a : SAGE_GREEN);
  orbMat.emissiveIntensity = 1.0 + 0.35 * Math.sin(t * 1.4);

  updateStream(usdtStream, live ? live.usdtChange24h : null, dt);
  updateStream(usdcStream, live ? live.usdcChange24h : null, dt);

  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
await fetchSummary();
setInterval(fetchSummary, 60000);
animate();
</script>
</body>
</html>
