<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Health — live 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
  #scene { position: fixed; inset: 0; }
  .hud {
    position: fixed; z-index: 10; color: #dfe8f5;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #title { top: 14px; left: 16px; pointer-events: none; }
  #title h1 { margin: 0; font-size: 20px; letter-spacing: 2px; font-weight: 600; color: #10b981; }
  #title p { margin: 4px 0 0; font-size: 12px; color: #8fa0bd; max-width: 340px; }
  #title a { color: #10b981; text-decoration: none; pointer-events: auto; }
  #stats {
    top: 14px; right: 16px; background: rgba(10, 16, 28, 0.72);
    border: 1px solid rgba(16, 185, 129, 0.28); border-radius: 10px;
    padding: 10px 14px; font-size: 12px; line-height: 1.7; min-width: 240px;
    backdrop-filter: blur(4px);
  }
  #stats .k { color: #8fa0bd; }
  #stats .v { color: #fff; font-variant-numeric: tabular-nums; }
  #stats .bloom { color: #7dffb0; } #stats .wilt { color: #ff9d6b; } #stats .calm { color: #8fa0bd; }
  #hint {
    bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #5d6f8f; pointer-events: none; white-space: nowrap;
  }
  #enterWrap { bottom: 42px; left: 50%; transform: translateX(-50%); }
  #enterLink {
    color: #dfe8f5; text-decoration: none; font-size: 15px; letter-spacing: 6px; font-weight: 600;
    padding: 10px 24px 10px 30px; border: 1px solid rgba(16, 185, 129, 0.4); border-radius: 999px;
    background: rgba(10, 16, 28, 0.6); backdrop-filter: blur(4px);
  }
  #enterLink:hover { border-color: #10b981; color: #fff; }
  #waiting {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 7, 13, 0.55); color: #cfe0ff; font-size: 15px; letter-spacing: 1px;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  #waiting.hidden { display: none; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  /* embed mode: slim chrome for iframes on the main page */
  body.embed #title, body.embed #hint { display: none; }
  body.embed #enterWrap { bottom: 14px; }
  body.embed #enterLink { font-size: 12px; padding: 7px 18px 7px 23px; }
  body.embed #stats { top: 8px; right: 8px; font-size: 11px; padding: 8px 10px; min-width: 0; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="scene"></div>
<div class="hud" id="title">
  <h1>NETWORK HEALTH</h1>
  <p>Live crowd activity on the XRP Ledger, tended by Nora. The emerald node is XRP; the satellites are wallets. Their pulse and the streams show how busy the network is right now.</p>
</div>
<div class="hud" id="stats"></div>
<div class="hud" id="hint">drag to orbit · scroll to zoom</div>
<div class="hud" id="enterWrap"><a id="enterLink" href="index.html#nora">NORA'S LAB</a></div>
<div id="waiting"><span class="pulse">awaiting live data…</span></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- data ---------------- */
const REPO = 'MisoPrettyStacks/building-a-thing-with-infoflow';
const DATA_BASE = `https://raw.githubusercontent.com/${REPO}/data/`;
let live = null; // { tx24h, txMed7d, addrs24h, volume24h, activityZ, bias, warmingUp, degraded, verdict, computedAt }

async function fetchSummary() {
  try {
    const r = await fetch(DATA_BASE + 'summary.json?m=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
    if (!r.ok) throw 0;
    const s = await r.json();
    const nw = s.network || {};
    let verdict = null;
    try {
      const rv = await fetch(DATA_BASE + 'nora_supervisor.json?m=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
      if (rv.ok) { const d = await rv.json(); verdict = d.verdict || null; }
    } catch { /* verdict stays null; page stays honest */ }
    live = {
      tx24h: nw.txCount24h ?? null,
      txMed7d: nw.txCountMed7d ?? null,
      addrs24h: nw.uniqueAddrs24h ?? null,
      volume24h: nw.volumeXrp24h ?? null,
      activityZ: nw.activityZ ?? 0,
      bias: nw.bias ?? 0,
      warmingUp: !!nw.warmingUp,
      degraded: !!nw.degraded,
      verdict,
      computedAt: s.generated_at,
    };
    document.getElementById('waiting').classList.add('hidden');
    refreshHud();
    refreshCrowd();
  } catch { /* keep last good state; overlay stays if never loaded */ }
}

function fmtCount(x) {
  if (x == null) return '—';
  const a = Math.abs(x);
  if (a >= 1e6) return (x / 1e6).toFixed(2) + 'M';
  if (a >= 1e3) return (x / 1e3).toFixed(1) + 'K';
  return String(Math.round(x));
}

function refreshHud() {
  const el = document.getElementById('stats');
  if (!live) { el.innerHTML = '<span class="k">waiting…</span>'; return; }
  const z = live.activityZ;
  const dir = z > 1.0 ? 'blooming' : z < -1.0 ? 'wilting' : 'calm';
  const cls = z > 1.0 ? 'bloom' : z < -1.0 ? 'wilt' : 'calm';
  const status = live.degraded ? '<span class="wilt">blind (feed down)</span>'
    : live.warmingUp ? '<span class="calm">warming up</span>'
    : `<span class="${cls}">${dir}</span>`;
  const vLabel = live.verdict === 'APPLY_CANDIDATE' ? 'APPLY' : (live.verdict || '—');
  el.innerHTML =
    `<div><span class="k">payments 24h</span> <span class="v">${fmtCount(live.tx24h)}</span></div>` +
    `<div><span class="k">active wallets</span> <span class="v">${fmtCount(live.addrs24h)}</span></div>` +
    `<div><span class="k">activity z</span> <span class="v ${cls}">${z >= 0 ? '+' : ''}${z.toFixed(2)}</span> <span class="${cls}">${dir}</span></div>` +
    `<div><span class="k">verdict</span> <span class="v">${vLabel}</span></div>` +
    `<div><span class="k">status</span> ${status}</div>`;
}

/* ---------------- scene ---------------- */
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070d, 0.028);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 14, 26);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxDistance = 60; controls.minDistance = 8;

scene.add(new THREE.AmbientLight(0x8899bb, 0.5));
const key = new THREE.DirectionalLight(0xd9ffe8, 1.1); key.position.set(10, 18, 8); scene.add(key);

// center: XRP emerald node
const xrpMat = new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x0a6b4a, emissiveIntensity: 1.4, roughness: 0.3 });
const xrp = new THREE.Mesh(new THREE.SphereGeometry(1.6, 48, 32), xrpMat);
scene.add(xrp);
const xrpGlow = new THREE.Mesh(
  new THREE.SphereGeometry(2.4, 32, 24),
  new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.14 })
);
scene.add(xrpGlow);

// satellites: wallet nodes pulsing with tx activity
const NODES = 10, RING_R = 11;
const ringNodes = [];
for (let i = 0; i < NODES; i++) {
  const a = (i / NODES) * Math.PI * 2;
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.55, 24, 18),
    new THREE.MeshStandardMaterial({ color: 0x2a7d5f, emissive: 0x0d4d36, emissiveIntensity: 0.9, roughness: 0.4 })
  );
  m.position.set(Math.cos(a) * RING_R, (Math.sin(i * 2.3) * 1.5), Math.sin(a) * RING_R);
  m.userData.angle = a;
  m.userData.phase = Math.random() * Math.PI * 2;
  scene.add(m); ringNodes.push(m);
}
// faint ring guide
const ringGeo = new THREE.TorusGeometry(RING_R, 0.03, 8, 128);
const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x1f3a30, transparent: true, opacity: 0.5 }));
ring.rotation.x = Math.PI / 2; scene.add(ring);

// payment edges: arcs between satellites suggesting live payments
const P_COUNT = 700;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(P_COUNT * 3);
const pSeed = [];
for (let i = 0; i < P_COUNT; i++) {
  pSeed.push({ a: i % NODES, b: (i * 3 + 1) % NODES, t: Math.random(), speed: 0.15 + Math.random() * 0.35, lane: (Math.random() - 0.5) * 1.6 });
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ color: 0x10b981, size: 0.22, transparent: true, opacity: 0.85, depthWrite: false, blending: THREE.AdditiveBlending });
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// crowd arcs: emerald edges between wallet nodes (scaled by live activity)
const crowdGroup = new THREE.Group(); scene.add(crowdGroup);
function refreshCrowd() {
  while (crowdGroup.children.length) {
    const c = crowdGroup.children.pop();
    c.geometry.dispose(); c.material.dispose();
  }
  if (!live) return;
  const z = Math.abs(live.activityZ);
  const edges = Math.min(2 + Math.round(z * 2), 8);
  for (let i = 0; i < edges; i++) {
    const na = ringNodes[(i * 3) % NODES], nb = ringNodes[(i * 3 + 4) % NODES];
    const a = na.position.clone(), b = nb.position.clone();
    const mid = a.clone().add(b).multiplyScalar(0.5); mid.y += 3 + Math.min(z, 5);
    const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
    const geo = new THREE.TubeGeometry(curve, 40, 0.08 + Math.min(z / 40, 0.25), 8, false);
    const mat = new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false });
    const tube = new THREE.Mesh(geo, mat);
    tube.userData.phase = Math.random() * Math.PI * 2;
    crowdGroup.add(tube);
  }
}

/* ---------------- animation ---------------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;

  // gentle float
  xrp.position.y = Math.sin(t * 0.8) * 0.25;
  xrpGlow.position.copy(xrp.position);

  // satellite nodes pulse with tx activity
  const z = live ? live.activityZ : 0;
  const strength = live ? Math.min(Math.abs(z) / 2, 1) : 0;
  ringNodes.forEach((m, i) => {
    const pulse = 1 + strength * 0.45 * Math.sin(t * 2.4 + m.userData.phase);
    m.scale.setScalar(Math.max(pulse, 0.6));
    m.material.emissiveIntensity = 0.6 + strength * 1.2 * (0.5 + 0.5 * Math.sin(t * 2.4 + m.userData.phase));
  });

  // payment streams speed up with activity
  pMat.color.setHex(z > 0.5 ? 0x34d399 : z < -0.5 ? 0xff9d6b : 0x10b981);
  pMat.opacity = 0.25 + strength * 0.65;
  const pos = pGeo.attributes.position.array;
  for (let i = 0; i < P_COUNT; i++) {
    const s = pSeed[i];
    s.t += dt * s.speed * (0.4 + strength * 1.8);
    if (s.t > 1) s.t -= 1;
    const na = ringNodes[s.a].position, nb = ringNodes[s.b].position;
    const x = na.x + (nb.x - na.x) * s.t;
    const zz = na.z + (nb.z - na.z) * s.t;
    const y = na.y + (nb.y - na.y) * s.t + Math.sin(s.t * Math.PI) * 2.0 + s.lane * Math.sin(s.t * Math.PI);
    pos[i * 3] = x + s.lane * 0.3; pos[i * 3 + 1] = y; pos[i * 3 + 2] = zz;
  }
  pGeo.attributes.position.needsUpdate = true;

  // crowd arcs shimmer
  crowdGroup.children.forEach((c) => {
    c.material.opacity = 0.4 + 0.3 * Math.sin(t * 2.0 + c.userData.phase);
  });
  // XRP node breathes with activity
  const excite = live ? Math.min(1 + strength * 0.8, 2.0) : 1;
  xrpMat.emissiveIntensity = 1.1 + 0.5 * Math.sin(t * 1.6) * excite * 0.5 + (excite - 1) * 0.8;

  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
await fetchSummary();
setInterval(fetchSummary, 30000);
animate();
</script>
</body>
</html>
